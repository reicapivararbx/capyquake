<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>Capiquake - Gameplay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-ink: #0b0b10;
      --bg-coffee: #1a120a;
      --panel: rgba(18, 18, 26, 0.66);
      --panel-strong: rgba(24, 18, 29, 0.78);
      --glass-line: rgba(255, 255, 255, 0.14);
      --text: #f5f0e8;
      --muted: #a8a2b6;
      --orange: #ff6600;
      --orange-soft: #ffb347;
      --purple: #7c3aed;
      --purple-soft: #a78bfa;
      --danger: #ff3f46;
      --health: #22c55e;
      --stamina: #38bdf8;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      position: relative;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(ellipse 70% 48% at 49% 38%, rgba(255, 102, 0, 0.13), transparent 64%),
        radial-gradient(ellipse 42% 34% at 88% 12%, rgba(124, 58, 237, 0.23), transparent 62%),
        radial-gradient(ellipse 36% 28% at 12% 86%, rgba(255, 140, 0, 0.13), transparent 64%),
        linear-gradient(180deg, var(--bg-ink) 0%, #111018 48%, var(--bg-coffee) 100%);
    }

    .scene {
      position: absolute;
      inset: 0;
      isolation: isolate;
    }

    .arena-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .arena-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.6), transparent 70%);
      opacity: 0.55;
    }

    .light-spot {
      position: absolute;
      left: 420px;
      top: 42px;
      width: 480px;
      height: 260px;
      background: radial-gradient(ellipse, rgba(255, 179, 71, 0.24), rgba(124, 58, 237, 0.08) 48%, transparent 72%);
      filter: blur(16px);
    }

    .arena-floor {
      position: absolute;
      left: -120px;
      right: -120px;
      bottom: -130px;
      height: 410px;
      transform: perspective(620px) rotateX(61deg);
      transform-origin: bottom center;
      border-radius: 48% 48% 0 0;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(255, 102, 0, 0.28), transparent 52%),
        linear-gradient(90deg, rgba(124, 58, 237, 0.14), transparent 18%, transparent 82%, rgba(255, 102, 0, 0.12)),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.055) 0 2px, transparent 2px 84px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 64px),
        linear-gradient(180deg, #2b160b 0%, #120d10 100%);
      box-shadow: inset 0 38px 90px rgba(255, 102, 0, 0.08), 0 -24px 100px rgba(0,0,0,0.35);
      opacity: 0.92;
    }

    .arena-structure {
      position: absolute;
      bottom: 192px;
      width: 96px;
      height: 172px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px 18px 8px 8px;
      background:
        linear-gradient(145deg, rgba(255, 179, 71, 0.12), transparent 35%),
        linear-gradient(180deg, rgba(42, 26, 10, 0.95), rgba(14, 12, 18, 0.95));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 24px 80px rgba(0,0,0,0.38);
    }

    .arena-structure.one { left: 90px; height: 156px; }
    .arena-structure.two { right: 144px; bottom: 214px; width: 74px; height: 220px; }
    .arena-structure.three { right: 432px; bottom: 178px; width: 52px; height: 132px; border-radius: 999px 999px 12px 12px; }

    .enemy {
      position: absolute;
      width: 58px;
      height: 68px;
      border-radius: 50% 50% 44% 44%;
      background:
        radial-gradient(circle at 57% 24%, rgba(255, 179, 71, 0.24), transparent 18%),
        radial-gradient(ellipse at 50% 55%, #7c2d12 0%, #35170f 62%, rgba(12,8,12,0.7) 100%);
      box-shadow: 0 0 24px rgba(255, 63, 70, 0.20), 0 18px 34px rgba(0,0,0,0.35);
      opacity: 0.92;
    }

    .enemy::before, .enemy::after {
      content: '';
      position: absolute;
      top: 18px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffb347;
      box-shadow: 0 0 12px rgba(255, 102, 0, 0.85);
    }

    .enemy::before { left: 18px; }
    .enemy::after { right: 18px; }

    .enemy-health {
      position: absolute;
      top: -14px;
      left: 50%;
      width: 60px;
      height: 6px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255,255,255,0.11);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.13);
    }

    .enemy-health-fill {
      height: 100%;
      width: 60%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--danger), var(--orange));
      box-shadow: 0 0 12px rgba(255, 63, 70, 0.42);
    }

    .player {
      position: absolute;
      left: 575px;
      top: 412px;
      width: 136px;
      height: 92px;
      filter: drop-shadow(0 28px 24px rgba(0,0,0,0.48));
      z-index: 3;
    }

    .capy-body {
      position: absolute;
      left: 12px;
      top: 24px;
      width: 96px;
      height: 52px;
      border-radius: 44px 54px 35px 35px;
      background: linear-gradient(135deg, #9a5b2e 0%, #6b351c 72%);
      box-shadow: inset 0 8px 16px rgba(255, 179, 71, 0.18), inset 0 -10px 18px rgba(0,0,0,0.2);
    }

    .capy-head {
      position: absolute;
      right: 20px;
      top: 8px;
      width: 50px;
      height: 45px;
      border-radius: 45% 55% 48% 42%;
      background: linear-gradient(145deg, #b46a34, #793c20 76%);
      box-shadow: inset 0 7px 12px rgba(255, 179, 71, 0.18);
    }

    .capy-ear {
      position: absolute;
      right: 48px;
      top: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #7b3d21;
    }

    .capy-eye {
      position: absolute;
      right: 40px;
      top: 22px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #110b0d;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.16);
    }

    .capy-muzzle {
      position: absolute;
      right: 12px;
      top: 30px;
      width: 22px;
      height: 14px;
      border-radius: 999px;
      background: rgba(236, 177, 102, 0.36);
    }

    .weapon-beam {
      position: absolute;
      right: -31px;
      top: 47px;
      width: 58px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1f2937, #111827 42%, var(--orange));
      box-shadow: 0 0 20px rgba(255, 102, 0, 0.35);
    }

    .projectile {
      position: absolute;
      width: 42px;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,179,71,0), #ffb347 32%, #ff6600 100%);
      box-shadow: 0 0 14px rgba(255, 102, 0, 0.92), 0 0 32px rgba(124, 58, 237, 0.34);
      z-index: 2;
    }

    .impact {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7cc 0 8%, #ffb347 20%, #ff6600 42%, rgba(124, 58, 237, 0.2) 58%, transparent 72%);
      box-shadow: 0 0 30px rgba(255, 102, 0, 0.72);
      z-index: 2;
    }

    .impact::before, .impact::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 179, 71, 0.82);
      transform: translate(-50%, -50%) rotate(35deg);
      box-shadow: 0 0 14px rgba(255,102,0,0.8);
    }

    .impact::after { transform: translate(-50%, -50%) rotate(-42deg); }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 30px;
      height: 30px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 179, 71, 0.86);
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(255, 102, 0, 0.5);
      z-index: 10;
    }

    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 179, 71, 0.86);
      border-radius: 999px;
    }

    #crosshair::before { left: 13px; top: -11px; width: 2px; height: 48px; }
    #crosshair::after { left: -11px; top: 13px; width: 48px; height: 2px; }

    .glass {
      border: 1px solid var(--glass-line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.045)), var(--panel);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.12);
      backdrop-filter: blur(18px) saturate(140%);
    }

    .top-hud {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 18px;
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 16px;
      align-items: start;
      z-index: 20;
    }

    .pill-row {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px;
    }

    .pill {
      min-width: 76px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pill strong {
      color: #fff;
      font-size: 16px;
      letter-spacing: 0;
    }

    .timer {
      color: var(--orange-soft);
      text-align: center;
      text-shadow: 0 0 24px rgba(255, 102, 0, 0.35);
    }

    .boss-panel {
      padding: 12px 14px 14px;
    }

    .boss-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .boss-head span:last-child { color: var(--orange-soft); }

    .boss-bar-track, .bar-track {
      position: relative;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .boss-bar-track { height: 14px; }

    .boss-fill {
      height: 100%;
      width: 75%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff3f46, #ff6600 58%, #ffb347);
      box-shadow: 0 0 22px rgba(255, 102, 0, 0.48);
    }

    .right-stack {
      display: grid;
      gap: 10px;
    }

    #kill-feed {
      padding: 12px;
      display: grid;
      gap: 7px;
      font-size: 12px;
      line-height: 1.2;
      color: rgba(245,240,232,0.86);
    }

    .kill-entry {
      padding: 7px 9px;
      border-radius: 12px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .killer { color: var(--orange-soft); font-weight: 800; }
    .victim { color: var(--purple-soft); font-weight: 800; }

    .resources {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .resources strong { color: #fff; letter-spacing: 0; }

    .bottom-hud {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 20px;
      display: grid;
      grid-template-columns: 330px 1fr 250px;
      gap: 18px;
      align-items: end;
      z-index: 20;
    }

    .status-panel {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .status-line {
      display: grid;
      grid-template-columns: 84px 1fr 42px;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bar-track { height: 11px; }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
    }

    .health-fill { width: 87%; background: linear-gradient(90deg, #16a34a, var(--health), #86efac); box-shadow: 0 0 16px rgba(34,197,94,0.45); }
    .stamina-fill { width: 68%; background: linear-gradient(90deg, #0284c7, var(--stamina), #a5f3fc); box-shadow: 0 0 16px rgba(56,189,248,0.42); }
    .xp-fill { width: 42%; background: linear-gradient(90deg, var(--purple-soft), var(--purple), var(--orange)); box-shadow: 0 0 18px rgba(124,58,237,0.5); }

    .hotbar {
      justify-self: center;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .slot {
      position: relative;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(145deg, rgba(255,255,255,0.11), rgba(255,255,255,0.04));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 10px 26px rgba(0,0,0,0.26);
    }

    .slot.active {
      border-color: rgba(255, 179, 71, 0.82);
      background: linear-gradient(145deg, rgba(255, 102, 0, 0.28), rgba(124, 58, 237, 0.16));
      box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.17), 0 0 28px rgba(255, 102, 0, 0.38), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .slot::after {
      content: attr(data-key);
      position: absolute;
      left: 7px;
      top: 5px;
      color: rgba(245,240,232,0.62);
      font-size: 10px;
      font-weight: 800;
    }

    .item {
      border-radius: 999px;
      background: linear-gradient(135deg, #f6ad55, #7c3aed);
      box-shadow: 0 0 14px rgba(255,102,0,0.32);
    }

    .item.wood { width: 14px; height: 34px; border-radius: 8px; background: linear-gradient(180deg, #9a5b2e, #5f2d16); transform: rotate(18deg); }
    .item.rifle { width: 34px; height: 10px; border-radius: 8px; background: linear-gradient(90deg, #e5e7eb, #4b5563 45%, #ff6600); }
    .item.blade { width: 9px; height: 35px; border-radius: 8px 8px 2px 2px; background: linear-gradient(180deg, #f8fafc, #94a3b8 62%, #7c3aed); transform: rotate(28deg); }
    .item.bow { width: 28px; height: 35px; border: 4px solid #ffb347; border-left-color: transparent; background: transparent; }
    .item.orb { width: 24px; height: 24px; background: radial-gradient(circle, #f5f3ff, #a78bfa 44%, #7c3aed 72%); }

    .weapon-card {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .weapon-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .ammo {
      color: var(--orange-soft);
      font-size: 18px;
    }

    .action-row {
      display: flex;
      gap: 10px;
    }

    .hud-button {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 9px 10px;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.07);
    }

    .hud-button.primary {
      border-color: rgba(255, 179, 71, 0.45);
      background: linear-gradient(135deg, rgba(255,102,0,0.28), rgba(124,58,237,0.18));
      color: #fff7ed;
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Capiquake gameplay screenshot mockup">
    <div class="arena-bg">
      <div class="light-spot"></div>
      <div class="arena-structure one"></div>
      <div class="arena-structure two"></div>
      <div class="arena-structure three"></div>
      <div class="arena-floor"></div>
    </div>

    <div class="enemy" style="top: 320px; left: 314px; transform: scale(0.98);">
      <div class="enemy-health"><div class="enemy-health-fill"></div></div>
    </div>
    <div class="enemy" style="top: 264px; left: 700px; transform: scale(0.86);">
      <div class="enemy-health"><div class="enemy-health-fill" style="width: 40%;"></div></div>
    </div>
    <div class="enemy" style="top: 365px; right: 275px; transform: scale(1.08);">
      <div class="enemy-health"><div class="enemy-health-fill" style="width: 80%;"></div></div>
    </div>

    <div class="player" aria-label="Capybara player">
      <div class="capy-body"></div>
      <div class="capy-ear"></div>
      <div class="capy-head"></div>
      <div class="capy-eye"></div>
      <div class="capy-muzzle"></div>
      <div class="weapon-beam"></div>
    </div>

    <div class="projectile" style="top: 445px; left: 715px; transform: rotate(-6deg);"></div>
    <div class="projectile" style="top: 428px; left: 790px; transform: rotate(-9deg) scale(0.82);"></div>
    <div class="impact" style="top: 307px; left: 332px;"></div>

    <div id="crosshair" aria-hidden="true"></div>

    <section class="top-hud" aria-label="Match status">
      <div class="pill-row glass">
        <div class="pill timer">Tempo<br><strong>7:32</strong></div>
        <div class="pill">Onda<br><strong>15</strong></div>
      </div>

      <div class="boss-panel glass">
        <div class="boss-head"><span>Chefe Final</span><span>HP 750 / 1000</span></div>
        <div class="boss-bar-track"><div class="boss-fill"></div></div>
      </div>

      <div class="right-stack">
        <div class="resources glass">
          <span>Tokens <strong>12</strong></span>
          <span>R$ <strong>3450</strong></span>
          <span>Armor <strong>25</strong></span>
        </div>
        <div id="kill-feed" class="glass">
          <div class="kill-entry"><span class="killer">Jogador</span> eliminou <span class="victim">Bot_Mineiro</span></div>
          <div class="kill-entry"><span class="killer">Bot_Paulista</span> eliminou <span class="victim">Bot_Carioca</span></div>
          <div class="kill-entry"><span class="killer">Jogador</span> eliminou <span class="victim">Bot_Baiano</span></div>
        </div>
      </div>
    </section>

    <section class="bottom-hud" aria-label="Player status and inventory">
      <div class="status-panel glass">
        <div class="status-line">
          <span>Vida</span>
          <div class="bar-track"><div class="bar-fill health-fill"></div></div>
          <strong>87</strong>
        </div>
        <div class="status-line">
          <span>Stamina</span>
          <div class="bar-track"><div class="bar-fill stamina-fill"></div></div>
          <strong>68</strong>
        </div>
        <div class="status-line">
          <span>XP</span>
          <div class="bar-track"><div class="bar-fill xp-fill"></div></div>
          <strong>42%</strong>
        </div>
      </div>

      <div class="hotbar glass">
        <div class="slot" data-key="1"><span class="item wood"></span></div>
        <div class="slot active" data-key="2"><span class="item rifle"></span></div>
        <div class="slot" data-key="3"><span class="item blade"></span></div>
        <div class="slot" data-key="4"><span class="item bow"></span></div>
        <div class="slot" data-key="5"><span class="item orb"></span></div>
        <div class="slot" data-key="6"></div>
        <div class="slot" data-key="7"></div>
        <div class="slot" data-key="8"></div>
      </div>

      <div class="weapon-card glass">
        <div class="weapon-title"><span>AK-47</span><span class="ammo">28 / 90</span></div>
        <div class="action-row">
          <button class="hud-button">Pausar</button>
          <button class="hud-button primary">Loja</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
