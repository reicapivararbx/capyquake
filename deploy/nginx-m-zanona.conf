server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = / { root /var/www/html/capyportal; index index.html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /index.html { root /var/www/html/capyportal; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    # Portal static modules (CSS/JS). Must NOT use /assets/ — that path is Capyquake.
    # No try_files here: alias + try_files is an nginx footgun.
    location /capy-portal/ {
        alias /var/www/html/capyportal/;
        add_header Cache-Control "public, max-age=300" always;
    }
    # SPA deep links — exact prefixes only; games/API/admin stay above/below intact.
    location ^~ /jogos { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /servidores { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /conquistas { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /wiki { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /novidades { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /perfil { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /amigos { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /u/ { root /var/www/html/capyportal; try_files /index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    # Per-game SPA subpaths (must not steal /capyquake/ play routes — those are longer/exact below)
    location ~ ^/(capyquake|capyrails|capyzen|find-the-markers)/(servidores|conquistas)/?$ {
        root /var/www/html/capyportal;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /capyzen { return 308 /capyzen/; }
    location /capyzen/ { root /var/www/html; index index.html; try_files $uri $uri/ =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /find-the-markers { return 308 /find-the-markers/; }
    location /find-the-markers/ { root /var/www/html; index index.html; try_files $uri $uri/ =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /capyquake { return 308 /capyquake/; }
    location /capyquake/ { proxy_pass http://127.0.0.1:8080/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /ws { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
    location /admin { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /assets/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }

    location = /capyrails { return 308 /capyrails/; }
    location = /capyrails/ws { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
    location /capyrails/ { alias /var/www/html/railsgame/dist/; index index.html; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /railsgame/ws { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
    location = /railsgame { return 308 /capyrails/; }
    location /railsgame/ { rewrite ^/railsgame/(.*)$ /capyrails/$1 permanent; }

    location /gamerails { alias /var/www/html/gamerails; try_files $uri $uri/ /gamerails/index.html =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location / { return 404; }
}

