<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="Capyzen — um novo projeto do universo Capy, em desenvolvimento.">
  <link rel="canonical" href="https://m.zanona.com.br/capyzen/">
  <title>Capyzen — Em breve</title>
  <style>
    :root { color-scheme: dark; --bg:#0d100d; --ink:#f2f0e7; --muted:#9ca69a; --sage:#9bc69d; --violet:#a78bfa; --line:rgba(255,255,255,.12); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 50% 20%,rgba(155,198,157,.16),transparent 28rem),radial-gradient(circle at 80% 90%,rgba(167,139,250,.12),transparent 24rem),var(--bg); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.2; background-image:radial-gradient(circle,rgba(255,255,255,.28) 1px,transparent 1px); background-size:32px 32px; mask-image:linear-gradient(#000,transparent 75%); }
    main { width:min(760px,100%); position:relative; padding:clamp(34px,7vw,72px); border:1px solid var(--line); border-radius:30px; background:rgba(16,19,16,.78); box-shadow:0 32px 100px rgba(0,0,0,.42); backdrop-filter:blur(14px); }
    .mark { display:grid; place-items:center; width:68px; height:68px; margin-bottom:34px; border:1px solid rgba(155,198,157,.35); border-radius:22px; background:rgba(155,198,157,.08); color:var(--sage); font-size:19px; font-weight:950; letter-spacing:.08em; }
    .eyebrow { color:var(--sage); font-size:11px; font-weight:900; letter-spacing:.25em; text-transform:uppercase; }
    h1 { margin:12px 0 18px; font-size:clamp(52px,11vw,92px); line-height:.95; letter-spacing:-.065em; }
    p { max-width:590px; color:var(--muted); font-size:clamp(16px,2vw,19px); line-height:1.65; }
    .status { display:inline-flex; align-items:center; gap:9px; margin:22px 0 34px; padding:8px 12px; border:1px solid rgba(167,139,250,.25); border-radius:999px; background:rgba(167,139,250,.07); color:#cbbcff; font-size:10px; font-weight:900; letter-spacing:.13em; }
    .status i { width:7px; height:7px; border-radius:50%; background:var(--violet); box-shadow:0 0 13px var(--violet); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 18px; border:1px solid var(--line); border-radius:12px; color:var(--ink); text-decoration:none; font-size:13px; font-weight:850; }
    a:first-child { border-color:transparent; background:var(--sage); color:#0b130c; }
    a:hover { transform:translateY(-2px); filter:brightness(1.08); }
    small { display:block; margin-top:34px; color:#6f786e; }
    :focus-visible { outline:2px solid var(--sage); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CZ</div>
    <span class="eyebrow">Universo Capy · próximo projeto</span>
    <h1>Capyzen.</h1>
    <p>Este projeto ainda não possui um build público. A página já está reservada e será atualizada conforme o conceito, o código e os testes ganharem forma.</p>
    <div class="status"><i></i> EM DESENVOLVIMENTO</div>
    <div class="actions">
      <a href="/">← Voltar aos projetos</a>
      <a href="/capyquake/">Jogar Capyquake</a>
    </div>
    <small>Nenhuma data de lançamento foi anunciada.</small>
  </main>
</body>
</html>
